<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">World Hub Wireframe</title>
  <desc id="desc">Prepared reference for later map/session navigation</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121829"/>
      <stop offset="55%" stop-color="#18263b"/>
      <stop offset="100%" stop-color="#10251f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { font: 800 44px Inter, Arial, sans-serif; fill: #f7fafc; }
      .subtitle { font: 500 20px Inter, Arial, sans-serif; fill: #b8c7d9; }
      .label { font: 700 20px Inter, Arial, sans-serif; fill: #f7fafc; }
      .small { font: 500 15px Inter, Arial, sans-serif; fill: #d8e2ed; }
      .tiny { font: 500 13px Inter, Arial, sans-serif; fill: #aebed0; }
      .card { fill: #20324d; stroke: #4fd1c5; stroke-width: 2; rx: 24; filter: url(#shadow); }
      .card2 { fill: #26344f; stroke: #f6ad55; stroke-width: 2; rx: 24; filter: url(#shadow); }
      .card3 { fill: #1f3a32; stroke: #68d391; stroke-width: 2; rx: 24; filter: url(#shadow); }
      .muted { fill: #1a2539; stroke: #6b7280; stroke-width: 1.5; rx: 18; }
      .line { stroke: #94a3b8; stroke-width: 4; stroke-linecap: round; }
      .dash { stroke: #f6ad55; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 10; }
      .accent { fill: #4fd1c5; }
      .warn { fill: #f6ad55; }
      .ok { fill: #68d391; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="72" y="86" class="title">World Hub Wireframe</text>
  <text x="72" y="124" class="subtitle">Prepared reference for later map/session navigation</text>

  <rect x="120" y="175" width="1200" height="590" rx="30" fill="#101827" stroke="#4fd1c5" stroke-width="3"/>
  <rect x="160" y="215" width="340" height="500" class="muted"/><text x="205" y="270" class="label">Character panel</text><text x="205" y="310" class="small">avatar, stats, quests</text>
  <rect x="540" y="215" width="520" height="500" class="card"/><text x="720" y="450" class="label">World hub / map</text><text x="675" y="492" class="small">safe social space placeholder</text>
  <rect x="1090" y="215" width="190" height="500" class="muted"/><text x="1130" y="270" class="label">Actions</text><text x="1120" y="318" class="small">party</text><text x="1120" y="358" class="small">inventory</text><text x="1120" y="398" class="small">quest</text>
  <rect x="260" y="780" width="920" height="48" class="muted"/><text x="315" y="811" class="small">M2/M3 reference only: do not implement before online session/account gates.</text>

  <text x="72" y="854" class="tiny">Linh Giới Online — planning/reference SVG, non-production art, generated for execution governance.</text>
</svg>
