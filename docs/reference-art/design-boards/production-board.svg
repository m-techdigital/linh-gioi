<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Production Board</title>
  <desc id="desc">Sandbox progress and handoff workflow reference</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121829"/>
      <stop offset="55%" stop-color="#18263b"/>
      <stop offset="100%" stop-color="#10251f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { font: 800 44px Inter, Arial, sans-serif; fill: #f7fafc; }
      .subtitle { font: 500 20px Inter, Arial, sans-serif; fill: #b8c7d9; }
      .label { font: 700 20px Inter, Arial, sans-serif; fill: #f7fafc; }
      .small { font: 500 15px Inter, Arial, sans-serif; fill: #d8e2ed; }
      .tiny { font: 500 13px Inter, Arial, sans-serif; fill: #aebed0; }
      .card { fill: #20324d; stroke: #4fd1c5; stroke-width: 2; rx: 24; filter: url(#shadow); }
      .card2 { fill: #26344f; stroke: #f6ad55; stroke-width: 2; rx: 24; filter: url(#shadow); }
      .card3 { fill: #1f3a32; stroke: #68d391; stroke-width: 2; rx: 24; filter: url(#shadow); }
      .muted { fill: #1a2539; stroke: #6b7280; stroke-width: 1.5; rx: 18; }
      .line { stroke: #94a3b8; stroke-width: 4; stroke-linecap: round; }
      .dash { stroke: #f6ad55; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 10; }
      .accent { fill: #4fd1c5; }
      .warn { fill: #f6ad55; }
      .ok { fill: #68d391; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="72" y="86" class="title">Production Board</text>
  <text x="72" y="124" class="subtitle">Sandbox progress and handoff workflow reference</text>

  <rect x="90" y="185" width="190" height="510" class="muted"/><text x="130" y="235" class="label">Backlog</text>
  <rect x="315" y="185" width="190" height="510" class="muted"/><text x="365" y="235" class="label">Ready</text>
  <rect x="540" y="185" width="190" height="510" class="card"/><text x="565" y="235" class="label">In progress</text>
  <rect x="765" y="185" width="190" height="510" class="card2"/><text x="820" y="235" class="label">Verify</text>
  <rect x="990" y="185" width="190" height="510" class="card"/><text x="1035" y="235" class="label">Handoff</text>
  <rect x="1215" y="185" width="145" height="510" class="card3"/><text x="1248" y="235" class="label">Done</text>
  <rect x="115" y="285" width="140" height="80" class="card2"/><text x="135" y="330" class="small">Gate task</text>
  <rect x="565" y="285" width="140" height="80" class="card"/><text x="585" y="330" class="small">S1/S2/S5</text>
  <rect x="790" y="285" width="140" height="80" class="card2"/><text x="806" y="330" class="small">Evidence</text>
  <rect x="1015" y="285" width="140" height="80" class="card"/><text x="1030" y="330" class="small">ZIP + SHA</text>
  <rect x="1230" y="285" width="115" height="80" class="card3"/><text x="1248" y="330" class="small">Accept</text>
  <text x="122" y="748" class="small">Each card must preserve baseline, allowed paths, evidence class, and next allowed step.</text>

  <text x="72" y="854" class="tiny">Linh Giới Online — planning/reference SVG, non-production art, generated for execution governance.</text>
</svg>
