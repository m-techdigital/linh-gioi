  <line x1="520" y1="494" x2="588" y2="494" class="line"/>
  <line x1="778" y1="494" x2="846" y2="494" class="line"/>
  <rect x="112" y="660" width="1180" height="98" class="muted"/>
  <text x="150" y="705" class="label">Rule</text><text x="230" y="705" class="small">Each milestone requires entry gate, real evidence, handoff, owner acceptance, and rollback point.</text>
