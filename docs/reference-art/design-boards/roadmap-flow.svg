  <line x1="262" y1="254" x2="330" y2="254" class="dash"/>
  <rect x="330" y="190" width="190" height="128" class="card2"/>
  <text x="362" y="240" class="label">M1 Offline</text><text x="362" y="270" class="small">combat loop</text>
