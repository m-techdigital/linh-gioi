  <rect x="846" y="190" width="190" height="128" class="card"/>
  <text x="878" y="240" class="label">M3 Account</text><text x="878" y="270" class="small">character data</text>
  <line x1="1036" y1="254" x2="1104" y2="254" class="line"/>
