spring:
  application:
    name: linh-gioi-api
  lifecycle:
    timeout-per-shutdown-phase: ${LG_API_SHUTDOWN_TIMEOUT:10s}

server:
  address: ${LG_API_HOST:0.0.0.0}
  port: ${LG_API_PORT:8080}
  shutdown: graceful

logging:
  pattern:
    console: '%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} logger=%logger{36} %kvp msg="%msg"%n'
